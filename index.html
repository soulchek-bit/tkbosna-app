<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b6436">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="TK Bosna">
<title>TK Bosna – evidencija treninga</title>
<style>
:root{--bg:#f3f5ef;--card:#fff;--ink:#16201a;--muted:#667068;--line:#e1e5dc;--brand:#2b6436;--brand2:#e7f1e3;--danger:#b3261e;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:17px;margin:0;font-weight:650;display:flex;align-items:center;gap:8px}
header h1 i{width:18px;height:18px;border-radius:50%;background:#d6e34b;display:inline-block;box-shadow:inset -3px 0 0 rgba(0,0,0,.08)}
.rolechip{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:999px;padding:8px 12px;font:inherit;font-size:14px;display:flex;align-items:center;gap:6px;max-width:55%}
.rolechip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:160px;border:0;background:none;padding:9px 4px 11px;font:inherit;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--brand);font-weight:650}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.steps{display:flex;gap:6px;margin-bottom:14px}
.st{flex:1;font-size:11px;color:var(--muted);border-top:4px solid var(--line);padding-top:6px}
.st.sdone,.st.on{border-color:var(--brand)}
.st.on{color:var(--ink);font-weight:650}
h2{font-size:21px;margin:6px 0 12px;letter-spacing:-.01em}
.search{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);font:inherit;font-size:16px;background:#fff;margin-bottom:12px;color:var(--ink)}
.kids{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kid{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--r);border:1px solid var(--line);background:#fff;font:inherit;text-align:left;min-height:66px;color:var(--ink)}
.kid:active,.type:active,.hr:active,button.row:active{transform:scale(.98);background:var(--brand2)}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--brand2);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:14px}
.kn{font-weight:600;font-size:15px;line-height:1.2}
.types{display:grid;gap:10px}
.type{display:flex;justify-content:space-between;align-items:center;padding:18px 16px;border-radius:var(--r);border:1px solid var(--line);border-left:7px solid var(--c);background:#fff;font:inherit;text-align:left;min-height:70px;color:var(--ink)}
.tn{font-weight:650;font-size:17px}.tp{color:var(--muted);font-size:14px;white-space:nowrap;margin-left:8px}
.hours{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hr{padding:18px 6px;border-radius:var(--r);border:1px solid var(--line);background:#fff;font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.hr b{font-size:30px;line-height:1.1}.hr em{font-style:normal;font-size:13px;color:var(--muted)}.hr span{font-size:12px;color:var(--brand);font-weight:600;margin-top:4px}
.picked{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--brand2);color:var(--brand);border:0;border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;font-weight:600}
.chip small{font-weight:400;opacity:.8}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:6px 16px 16px;margin-bottom:6px}
.cf-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.cf-row span{color:var(--muted)} .cf-row b{text-align:right}
.cf-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px}
.cf-total b{font-size:32px;color:var(--brand);letter-spacing:-.02em}
input[type=date],input[type=month],select{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:600;margin-top:10px;color:var(--ink)}
.btn.big{padding:18px;font-size:18px}
.btn.ok{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.done{text-align:center;padding-top:16px}
.tick{width:76px;height:76px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;margin:0 auto 10px}
.tick svg{width:40px;height:40px;stroke-width:3}
.done .sum{font-size:17px;margin:4px 0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bar h2{margin:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:6px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi b{font-size:20px}
.kpi.main{grid-column:1/-1;background:var(--brand);color:#fff;border-color:var(--brand)} .kpi.main span{color:rgba(255,255,255,.8)} .kpi.main b{font-size:32px;letter-spacing:-.02em}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;font-weight:650}
.rows{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);width:100%;background:none;font:inherit;text-align:left;color:inherit}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--muted)}
.amt{font-weight:650;white-space:nowrap}
.chev{color:var(--muted);width:18px;height:18px;flex:none}
.xbtn{border:1px solid var(--line);background:#fff;color:var(--danger);font:inherit;font-size:12px;padding:5px 9px;border-radius:8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.dayhead{display:flex;justify-content:space-between;padding:16px 4px 8px;font-weight:650;font-size:15px}
details.day{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
details.day summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:13px 14px;font-weight:600;cursor:pointer;gap:8px}
details.day summary::-webkit-details-marker{display:none}
details.day summary .s{font-weight:400;font-size:13px;color:var(--muted)}
details.day[open] summary{border-bottom:1px solid var(--line);background:#fafbf8}
.track{height:6px;background:var(--bg);border-radius:3px;margin-top:6px;overflow:hidden}.track i{display:block;height:100%;background:var(--c,var(--brand));border-radius:3px}
.report{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 16px}
.rp-club{font-weight:700;color:var(--brand);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.report h2{margin:4px 0 2px;font-size:20px}
.rp-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:16px 0;padding:12px 14px;background:var(--bg);border-radius:12px;font-size:14px}
.rp-meta span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rp-meta b{word-break:break-word}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line);letter-spacing:.03em}
.tbl td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td small{display:block;color:var(--muted);font-size:12px}
.tbl .r{text-align:right;white-space:nowrap}
.tbl tfoot td{font-weight:650;border-bottom:0}
.rp-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding:14px 16px;background:var(--brand);color:#fff;border-radius:12px}
.rp-total span{font-size:14px;margin-right:10px}.rp-total b{font-size:24px;letter-spacing:-.02em;white-space:nowrap}
.rp-foot{font-size:12.5px;color:var(--muted);margin-top:14px}
.muted{color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin-top:22px;text-align:center;line-height:1.5}
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,12,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:22px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sh-title{font-size:19px;font-weight:700;margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;z-index:30;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.set .item{padding:12px 14px;border-bottom:1px solid var(--line)}
.set .item:last-child{border-bottom:0}
.set input{width:100%;font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:#fff}
.set label{font-size:12px;color:var(--muted);display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.trow{display:grid;grid-template-columns:12px 1fr 96px auto;gap:8px;align-items:center}
.addbtn{border:0;background:none;color:var(--brand);font:inherit;font-weight:650;padding:12px 14px;width:100%;text-align:left}
.hint{font-size:13px;color:var(--muted);margin:8px 4px 0}
.empty{text-align:center;color:var(--muted);padding:34px 10px;background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
.back{border:0;background:none;color:var(--brand);font:inherit;font-weight:600;padding:4px 0;margin-bottom:8px;display:flex;align-items:center;gap:2px}
.back svg{width:18px;height:18px}
.navrow{display:flex;gap:10px}.navrow .btn{flex:1}
.kidhead{display:flex;justify-content:space-between;padding:11px 14px 2px;font-weight:650;font-size:15px}
details.day .kidhead:not(:first-of-type){border-top:1px solid var(--line);margin-top:4px}
.row.sub{padding:7px 14px;border-bottom:0}
.editlbl{font-size:12px;color:var(--brand);font-weight:600;border:1px solid var(--line);border-radius:8px;padding:4px 8px;flex:none}
.tap{cursor:pointer}.tap:active{background:var(--brand2)}
.ef label{display:block;font-size:12px;color:var(--muted);margin-top:12px}
.ef select,.ef input{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.hpick{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.hpick button{flex:1;min-width:44px;padding:11px 0;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-weight:650;color:var(--ink)}
.hpick button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
@media (min-width:520px){.kids{grid-template-columns:repeat(3,1fr)}.hours{grid-template-columns:repeat(6,1fr)}}

.login{max-width:420px;margin:6vh auto 0;text-align:left}
.lg-ball{width:56px;height:56px;border-radius:50%;background:#d6e34b;margin-bottom:16px;position:relative;overflow:hidden}
.lg-ball::before,.lg-ball::after{content:"";position:absolute;width:56px;height:56px;border-radius:50%;border:3px solid var(--brand);top:0}
.lg-ball::before{left:-38px}.lg-ball::after{right:-38px}
.login label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:14px}
.login input{display:block;width:100%;margin-top:6px;padding:14px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.login .btn{margin-top:20px}
.err{background:#fdecea;color:var(--danger);border:1px solid #f5c6c2;border-radius:12px;padding:12px 14px;margin:14px 0 0;font-size:14px}
.loading{text-align:center;padding:22vh 0;color:var(--muted)}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.btn:disabled{opacity:.6}
/* ponašanje kao aplikacija: bez zumiranja, bez "gumenog" skrolanja, bez označavanja teksta na dugmadima */
html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font-size:16px!important}
button,a,label{touch-action:manipulation}
/* iPhone (ikona na početnom ekranu): kratki ekrani ne podižu donju traku */
html{min-height:calc(100% + env(safe-area-inset-top))}
body{min-height:calc(100vh + env(safe-area-inset-top))}
/* kanali slanja: tri ikone u jednom redu */
.chan,.sendrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.chan button,.snd{height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font:600 13px/1 inherit;color:#8a918b;padding:0 4px;transition:background .15s,color .15s,border-color .15s}
.chan button svg,.snd svg{width:18px;height:18px;flex:none}
.chan button.on.email{background:#e8f0fe;border-color:#b6cbf3;color:#1d5bd8}
.chan button.on.viber{background:#efeafd;border-color:#cdbff7;color:#7360f2}
.chan button.on.whatsapp{background:#e3f7ea;border-color:#a9e3be;color:#128c4a}
.sendrow{grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
.snd{height:46px;color:#fff;border:0;font-size:14px}
.snd.email{background:#1d5bd8}.snd.viber{background:#7360f2}.snd.whatsapp{background:#1fa855}
.snd[data-miss]{opacity:.45}
.set textarea{width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:#fff;margin-top:4px;resize:vertical;line-height:1.4}
.pv{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;line-height:1.45;max-height:50vh;overflow:auto;-webkit-user-select:text;user-select:text}
.offic{width:56px;height:56px;border-radius:50%;background:#fdecea;color:var(--danger);display:grid;place-items:center;font:800 28px/1 inherit;margin:0 auto}
/* superadmin */
.pbanner{background:#fff4e0;border:1px solid #f2d39b;color:#7a4b00;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.pbanner button{border:0;background:#7a4b00;color:#fff;border-radius:8px;padding:6px 10px;font:600 13px inherit}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.yn .btn{margin-top:0}
.sdot{width:12px;height:12px;border-radius:50%;flex:none}.sdot.on{background:#1fa855}.sdot.off{background:#d98a00}
.dl{font-size:12px;font-weight:700}.dl.up{color:#1fa855}.dl.dn{color:var(--danger)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px;background:#fdecea;color:var(--danger);vertical-align:middle}.tag.ok{background:#e3f7ea;color:#128c4a}
.rsel{font-size:14px!important;padding:6px 8px;border-radius:8px;max-width:110px}
.bstat{border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}.bstat.ok{background:#e3f7ea;color:#0f6b38}.bstat.no{background:#fdecea;color:var(--danger)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:10px;font:600 14px inherit;color:var(--muted)}.seg button.on{background:var(--ink);color:#fff}
.nconf{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;letter-spacing:.08em;margin-top:4px}
.btn.danger:not(.ghost){background:#fff;border-color:#f0c4c0}
.btn:disabled{opacity:.45}
.ist{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.ist.ok{background:#e3f7ea;color:#128c4a}.ist.skip{background:#eef0ec;color:var(--muted)}.ist.err{background:#fdecea;color:var(--danger)}
.rows.imp{max-height:38vh;overflow:auto}
.ef textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);resize:vertical}
.rows.imp .row{padding:8px 12px}
/* radno vrijeme */
.wcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 6px;margin-bottom:14px}
.wstat{display:flex;align-items:center;gap:10px}
.wstat b{font-size:15px}.wstat .s{font-size:13px;color:var(--muted)}
.wbtn{width:auto;margin:0;padding:11px 14px;border-radius:12px;font-size:15px;white-space:nowrap;flex:none}
.wbtn.go{background:var(--brand);color:#fff;border-color:var(--brand)}
.wbtn.stop{background:#fff;color:var(--danger);border-color:#f0c4c0}
.lnk{border:0;background:none;padding:0;font:inherit;font-size:13px;color:var(--brand);text-decoration:underline;text-underline-offset:2px;text-align:left}
.wlink{display:block;width:100%;text-align:right;text-decoration:none;font-weight:600;padding:8px 0 4px;margin-top:6px;border-top:1px solid var(--line)}
.wwarn{background:#fff4e0;border:1px solid #f2d39b;color:#7a4b00;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:10px;line-height:1.4}
.wwarn button{border:0;background:#7a4b00;color:#fff;border-radius:8px;padding:5px 9px;font:600 12.5px inherit;margin-top:6px;display:inline-block}
.wb{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;vertical-align:middle;margin:2px 2px 2px 0}
.wb.live{background:#e3f7ea;color:#128c4a}.wb.warn{background:#fff4e0;color:#8a5400}.wb.ok{background:#eef0ec;color:var(--muted)}
.wnote{margin-top:3px;color:var(--ink);font-size:13px}
.wrow{align-items:flex-start}.wrow .grow{min-width:0}
.wbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
/* v6: više djece, harmonika, trajanja, swipe */
.kidbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 10px}
.kidbar h2{margin:0}
.kbtns{display:flex;gap:6px;flex:none}
.kb{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font:600 13.5px/1 inherit;color:var(--ink);white-space:nowrap}
.kb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kb.go{background:var(--brand);color:#fff;border-color:var(--brand)}
.kb:disabled{opacity:.4}
.kid.sel{border-color:var(--brand);background:var(--brand2);box-shadow:inset 0 0 0 1.5px var(--brand)}
.kid.sel .av{background:var(--brand);color:#fff}
.klist{text-align:right;line-height:1.5;font-weight:600}
.acc{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.acc-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:15px 14px;font:inherit;text-align:left;color:var(--ink)}
.acc-t{font-weight:650;font-size:16px;flex:1}
.acc-s{font-size:13px;color:var(--muted);text-align:right}

<script>
/* =====================================================================
   TK Bosna – evidencija treninga (povezano sa Supabase bazom)
   ===================================================================== */
const CFG={
  url:'https://gqdeabzvfxdytymargil.supabase.co',
  key:'sb_publishable_bcbQYWEt6CFW8G2AuC6lOg_1HPmwh7M',
  club:'TK Bosna'
};
const HOURS=[0.5,1,1.5,2,2.5,3];
const DAYS=['nedjelja','ponedjeljak','utorak','srijeda','četvrtak','petak','subota'];
const MONTHS=['januar','februar','mart','april','maj','juni','juli','august','septembar','oktobar','novembar','decembar'];
const COLORS=['#2b6436','#3b7dd8','#d9822b','#8e5bd1','#c0392b','#0f8b8d','#b5892b','#5d6b7a'];
const I={
 plus:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
 list:'<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>',
 chart:'<svg viewBox="0 0 24 24"><path d="M3 20h18M6 16v-5M11 16V6M16 16v-8"/></svg>',
 doc:'<svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/></svg>',
 gear:'<svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>',
 chev:'<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
 left:'<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',

 shield:'<svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>'
};

/* ---------- pomoćne ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const fmtDate=s=>{const d=parseISO(s);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+'.'};
function fmtDay(s){const d=parseISO(s);const y=iso(new Date(Date.now()-864e5));const w=DAYS[d.getDay()];const l=s===today()?'Danas':s===y?'Jučer':w[0].toUpperCase()+w.slice(1);return l+', '+fmtDate(s)}
const monthLabel=m=>{const[y,mm]=m.split('-').map(Number);return MONTHS[mm-1]+' '+y};
function km(n){if(n==null||isNaN(n))return '—';let[a,b]=Math.abs(n).toFixed(2).split('.');a=a.replace(/\B(?=(\d{3})+(?!\d))/g,'.');return(n<0?'-':'')+a+','+b+' KM'}
const num=h=>String(h).replace('.',',');
const hrs=h=>((h*2)%1===0?num(h)+' h':durText(h));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=n=>String(n||'?').trim().split(/\s+/).map(x=>x[0]||'').join('').slice(0,2).toUpperCase();
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const r2=n=>Math.round(n*100)/100;
const tHM=ts=>ts?new Date(ts).toLocaleTimeString('bs-BA',{timeZone:'Europe/Sarajevo',hour:'2-digit',minute:'2-digit'}):'';
const fmtShort=m=>{m=Math.max(0,Math.round(m||0));return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'};
function fmtMin(m){m=Math.max(0,Math.round(m||0));const h=Math.floor(m/60),mm=m%60;return h?(h+' h'+(mm?' '+mm+' min':'')):mm+' min'}
const liveMin=r=>r.end?r.min:Math.max(0,Math.round((Date.now()-Date.parse(r.start))/60000));
const myOpen=()=>S.myRecent.find(r=>!r.end&&r.trainerId===meId());
const myMissingEnd=()=>S.myRecent.find(r=>r.trainerId===meId()&&r.auto&&r.flag&&!r.pEnd);
function workBadges(r){const b=[];
 if(!r.end)b.push('<span class="wb live">u toku</span>');
 if(r.auto)b.push('<span class="wb warn">zatvoreno u ponoć</span>');
 if(r.flag)b.push('<span class="wb warn">čeka provjeru</span>');
 if(r.fixedBy&&!r.flag)b.push('<span class="wb ok">provjereno</span>');
 return b.join(' ')}
function workRow(r,dir){
 const prop=[r.pStart&&('početak '+tHM(r.pStart)),r.pEnd&&('kraj '+tHM(r.pEnd))].filter(Boolean).join(', ');
 return `<div class="row wrow"><div class="grow"><div class="t">${tHM(r.start)} – ${r.end?tHM(r.end):'…'} <span class="muted" style="font-weight:500">· ${fmtMin(liveMin(r))}</span></div>
  <div class="s">${workBadges(r)}${r.note?`<div class="wnote">„${esc(r.note)}“</div>`:''}${prop?`<div class="wnote">Predlaže: ${prop}</div>`:''}</div>
  ${dir?`<div class="wbtns">${prop?`<button class="xbtn" style="color:var(--brand)" data-act="wacc" data-id="${r.id}">Prihvati</button>`:''}${r.flag&&!prop?`<button class="xbtn" style="color:var(--brand)" data-act="wok" data-id="${r.id}">U redu</button>`:''}<button class="xbtn" style="color:var(--brand)" data-act="wedit" data-id="${r.id}">Uredi</button><button class="xbtn" data-act="wdel" data-id="${r.id}">✕</button></div>`
   :(r.end?`<div class="wbtns"><button class="xbtn" style="color:var(--brand)" data-act="wprop" data-id="${r.id}">Predloži ispravku</button></div>`:'')}</div></div>`;
}
function workCard(){
 const o=myOpen(),miss=myMissingEnd();
 let h='';
 if(miss)h+=`<div class="wwarn">Niste završili rad ${fmtDate(miss.date).slice(0,6)} – zatvoreno je u ponoć. <button data-act="wprop" data-id="${miss.id}">Upiši kada ste završili</button></div>`;
 h+=`<div class="wcard">`;
 if(o)h+=`<div class="wstat"><span class="sdot on"></span><div class="grow"><b>Radite od ${tHM(o.start)}</b><div class="s" id="wtimer">${fmtMin(liveMin(o))}</div></div><button class="btn wbtn stop" data-act="wstop">Završi rad</button></div>`;
 else h+=`<div class="wstat"><span class="sdot off"></span><div class="grow"><b>Rad nije započet</b><div class="s"><button class="lnk" data-act="wlate">Zaboravio/la sam započeti na vrijeme</button></div></div><button class="btn wbtn go" data-act="wstart">Započni rad</button></div>`;
 h+=`<button class="lnk wlink" data-act="go" data-v="sati">Pregled mojih sati ›</button></div>`;
 return h;
}
function groupBy(a,f){const o={};a.forEach(x=>{const k=f(x);(o[k]=o[k]||[]).push(x)});return o}

/* ---------- baza ---------- */
let sb=null;
try{sb=window.supabase.createClient(CFG.url,CFG.key)}catch(e){}
async function q(p){const{data,error}=await p;if(error)throw error;return data}
const isNetErr=e=>/Failed to fetch|NetworkError|network|Load failed|fetch|timed out|offline/i.test(String((e&&(e.message||e.name))||e||''));
function errText(e){
 const m=String((e&&(e.message||e.error_description))||e||'');
 if(isNetErr(e))return 'Nema veze s internetom. Pokušajte ponovo.';
 if(/row-level security|permission denied|PGRST116|0 rows/i.test(m))return 'Nemate dozvolu za ovu radnju.';
 if(/Invalid login credentials/i.test(m))return 'Pogrešan email ili lozinka.';
 if(/Email not confirmed/i.test(m))return 'Email nije potvrđen. Javite se direktoru.';
 return m||'Došlo je do greške.';
}
const nn=v=>v==null?null:+v;
const mapE=r=>({id:r.id,date:r.datum,childId:r.dijete_id,trainerId:r.trener_id,typeId:r.vrsta_id,typeName:r.naziv_vrste,hours:+r.sati,price:nn(r.cijena_po_satu),amount:nn(r.iznos)||0,ts:Date.parse(r.kreirano)||0,from:r.vrijeme_od?String(r.vrijeme_od).slice(0,5):'',to:r.vrijeme_do?String(r.vrijeme_do).slice(0,5):''});
const mapC=r=>({id:r.id,name:r.ime,parent:r.roditelj||'',email:r.email_roditelja||'',phone:r.telefon_roditelja||'',ch:Array.isArray(r.kanali)?r.kanali:[],archived:!r.aktivno});
const mapT=r=>({id:r.id,name:r.naziv,price:nn(r.cijena_po_satu),color:r.boja||'#999',archived:!r.aktivno,order:r.redoslijed||0});
const mapP=r=>({id:r.id,name:r.ime,role:r.uloga,email:r.email||'',archived:!r.aktivan});

/* ---------- stanje ---------- */
let me=null;
const S={work:[],myRecent:[],types:[],children:[],trainers:[],entries:[],trenerVidiCijene:true,msg:{naslov:'',uvod:'',zavrsetak:''}};
const SP=()=>isDir()||S.trenerVidiCijene;
let loadedMonth=null,view='unos',W={step:1},month=today().slice(0,7),trFilter='',reportChild=null,busy=false,E=null;

const child=id=>S.children.find(c=>c.id===id)||{name:'(nepoznato dijete)',parent:'',email:''};
const type=id=>S.types.find(t=>t.id===id);
const typeColor=e=>(type(e.typeId)||{}).color||'#999';
const trName=id=>(S.trainers.find(t=>t.id===id)||(me&&me.id===id?me:null)||{name:'—'}).name;
const isDir=()=>!!me&&(me.role==='direktor'||me.role==='superadmin');
const isSuper=()=>!!me&&me.role==='superadmin';
const meId=()=>me&&me.id;
const visible=()=>isDir()?S.entries:S.entries.filter(e=>e.trainerId===meId());
const active=a=>a.filter(x=>!x.archived);
const byName=(a,b)=>a.name.localeCompare(b.name,'bs');

async function loadBase(){
 const [p,c,t,st]=await Promise.all([
  q(sb.from('profili').select('*').order('ime')),
  q(sb.from('djeca').select('*').order('ime')),
  q(sb.rpc('vrste_lista')),
  q(sb.from('postavke').select('*').eq('id',1))]);
 S.trainers=p.map(mapP);S.children=c.map(mapC);S.types=t.map(mapT);
 const p0=(st&&st[0])||{};
 S.trenerVidiCijene=p0.treneri_vide_cijene!==false;
 S.durations=Array.isArray(p0.trajanja)&&p0.trajanja.length?p0.trajanja.map(Number).sort((a,b)=>a-b):HOURS.slice();
 S.msg={naslov:p0.poruka_naslov??'Obračun treninga za {mjesec} – {dijete}',uvod:p0.poruka_uvod??'Poštovani/a {roditelj},\n\nu nastavku je pregled treninga za {dijete} za period {mjesec}.',zavrsetak:p0.poruka_zavrsetak??'Srdačan pozdrav,\n'+CFG.club};
}
const mapR=r=>({id:r.id,trainerId:r.trener_id,date:r.datum,start:r.pocetak,end:r.kraj,min:+r.minuta||0,auto:!!r.auto_zatvoreno,note:r.napomena||'',pStart:r.predlozeni_pocetak,pEnd:r.predlozeni_kraj,flag:!!r.trazi_ispravku,fixedBy:r.ispravio,fixedAt:r.ispravljeno});
async function loadWork(){
 const[y,m]=month.split('-').map(Number);
 const two=iso(new Date(Date.now()-2*864e5));
 const [a,b]=await Promise.all([
  q(sb.rpc('radno_lista',{od:month+'-01',do_:iso(new Date(y,m,0))})),
  q(sb.rpc('radno_lista',{od:two,do_:today(),p_trener:me.id}))]);
 S.work=a.map(mapR);S.myRecent=b.map(mapR);
}
async function loadMonth(force){
 if(!force&&loadedMonth===month)return;
 const[y,m]=month.split('-').map(Number);
 const r=await q(sb.rpc('treninzi_lista',{od:month+'-01',do_:iso(new Date(y,m,0))}));
 S.entries=r.map(mapE);loadedMonth=month;
 await loadWork();
}
async function fetchEntry(id){const r=await q(sb.rpc('treninzi_lista',{p_id:id}));if(!r||!r.length)throw new Error('0 rows');return r[0]}
async function refresh(full){
 try{if(full)await loadBase();await loadMonth(true);render()}catch(e){toast(errText(e))}
}

/* ---------- prijava ---------- */
function showLogin(msg,email){
 me=null;$('#nav').innerHTML='';$('#acct').style.display='none';
 $('#main').innerHTML=`<div class="login"><div class="lg-ball"></div><h2>Evidencija treninga</h2><p class="muted" style="margin-top:-6px">${esc(CFG.club)} · prijava za trenere i upravu</p>
 <div class="err" id="lerr" ${msg?'':'hidden'}>${esc(msg||'')}</div>
 <form id="lf" method="post" action="#" autocomplete="on">
 <label for="le">Email</label><input type="email" id="le" name="username" autocomplete="username" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" required value="${esc(email||'')}">
 <label for="lp">Lozinka</label><input type="password" id="lp" name="password" autocomplete="current-password" required>
 <button class="btn big ok" type="submit" id="lb">Prijavi se</button></form>
 <p class="note">Pristupne podatke dobijate od uprave kluba.</p></div>`;
}
function loginError(msg){const e=$('#lerr');if(!e)return showLogin(msg);e.textContent=msg;e.hidden=false;const b=$('#lb');b.disabled=false;b.textContent='Prijavi se'}
function showLoading(t){$('#main').innerHTML=`<div class="loading"><div class="spin"></div><p>${esc(t||'Učitavam…')}</p></div>`}
function showPaused(){
 $('#nav').innerHTML='';$('#acct').style.display='none';
 $('#main').innerHTML=`<div class="loading" style="padding-top:16vh"><div class="offic" style="background:#fff4e0;color:#b26a00">‖</div><h2 style="margin:10px 0 4px">Pristup je privremeno obustavljen</h2>
 <p class="muted" style="margin:0 0 20px">Aplikacija je trenutno pauzirana. Za više informacija kontaktirajte administratora.</p>
 <button class="btn big ok" data-act="retry">Provjeri ponovo</button><button class="btn ghost" data-act="logout">Odjavi se</button></div>`;
}
function showOffline(){
 $('#nav').innerHTML='';
 $('#main').innerHTML=`<div class="loading" style="padding-top:18vh"><div class="offic">!</div><h2 style="margin:10px 0 4px">Nema veze s internetom</h2>
 <p class="muted" style="margin:0 0 20px">Ostali ste prijavljeni. Provjerite internet i pokušajte ponovo.</p>
 <button class="btn big ok" data-act="retry">Pokušaj ponovo</button></div>`;
}
async function afterLogin(user){
 showLoading();
 try{
  const rows=await q(sb.from('profili').select('*').eq('id',user.id));
  const prof=rows&&rows[0];
  if(!prof||!prof.aktivan){await sb.auth.signOut();return showLogin('Vaš račun nema pristup aplikaciji. Javite se upravi kluba.',user.email)}
  me=mapP(prof);
  const st=await q(sb.rpc('app_status'));S.paused=!!(st&&st.pauzirano);
  if(S.paused&&!isSuper())return showPaused();
  await loadBase();await loadMonth(true);
  view=isDir()?'pregled':'unos';W={step:1};
  $('#acct').style.display='';render(true);
 }catch(e){if(isNetErr(e))showOffline();else showLogin(errText(e),user.email)}
}
document.addEventListener('submit',async e=>{
 if(e.target.id!=='lf')return;e.preventDefault();
 const email=$('#le').value.trim(),password=$('#lp').value;const b=$('#lb');b.disabled=true;b.textContent='Prijavljujem…';
 let r;try{r=await sb.auth.signInWithPassword({email,password})}catch(err){return loginError(errText(err))}
 if(r.error)return loginError(errText(r.error));
 afterLogin(r.data.user);
});
async function boot(){
 showLoading();
 try{
  const{data,error}=await sb.auth.getSession();
  const session=data&&data.session;
  if(session&&session.user)return afterLogin(session.user);
  if(error&&isNetErr(error))return showOffline();
  showLogin();
 }catch(e){if(isNetErr(e))showOffline();else showLogin(errText(e))}
}

/* ---------- prikaz ---------- */
function render(scroll){
 if(!me)return;
 $('#club').textContent=CFG.club;
 $('#who').textContent=me.name;
 const tabs=isDir()?[['pregled','Pregled',I.chart],['djeca','Izvještaji',I.doc],['unos','Unos',I.plus],['postavke','Postavke',I.gear]].concat(isSuper()?[['admin','Admin',I.shield]]:[])
                  :[['unos','Unos',I.plus],['moji','Moji unosi',I.list]];
 const ok=tabs.map(t=>t[0]).concat(['sati'],isDir()?['izvjestaj','radno','lista']:[]);
 if(!ok.includes(view))view=tabs[0][0];
 const act=view==='sati'?'unos':(view==='radno'||view==='lista')?'pregled':view==='izvjestaj'?(reportFrom==='pregled'||reportFrom==='admin'?reportFrom:'djeca'):view;
 $('#nav').innerHTML=tabs.map(t=>`<button class="${t[0]===act?'on':''}" data-act="go" data-v="${t[0]}">${t[2]}${t[1]}</button>`).join('');
 $('#main').innerHTML=(isSuper()&&S.paused?`<div class="pbanner">Aplikacija je pauzirana – treneri i direktor nemaju pristup. <button data-act="go" data-v="admin">Admin</button></div>`:'')+V[view]();
 if(scroll)window.scrollTo(0,0);
 syncHistory();
}
const V={};
/* ---------- nazad (dugme, swipe s ivice, Android "nazad") ---------- */
let reportFrom='djeca';
function backTarget(){
 if($('#sheet')&&$('#sheet').innerHTML)return 'sheet';
 if(!me)return null;
 if(view==='unos'&&W.step>1&&W.step<5)return 'step';
 if(view==='sati')return 'unos';
 if(view==='izvjestaj')return reportFrom||'djeca';
 if(view==='radno'||view==='lista')return 'pregled';
 return null;
}
function performBack(){const t=backTarget();if(!t)return false;
 if(t==='sheet'){closeSheet();return true}
 if(t==='step'){W.step--;render(true);return true}
 view=t;render(true);if(t!=='unos'&&t!=='postavke')refresh();return true}
let hasEntry=false;
function syncHistory(){try{if(backTarget()&&!hasEntry){history.pushState({tk:1},'');hasEntry=true}}catch(e){}}
window.addEventListener('popstate',()=>{hasEntry=false;performBack();syncHistory()});
function goBack(){if(hasEntry){try{history.back();return}catch(e){}}performBack()}
if(navigator.standalone===true){
 let sx=null,sy=0,t0=0;const hint=document.createElement('div');hint.id='swipehint';hint.textContent='‹';document.body.appendChild(hint);

 document.addEventListener('touchmove',e=>{if(sx===null)return;const dx=Math.max(0,Math.min(90,e.touches[0].clientX-sx));hint.style.opacity=dx/90;hint.style.transform=`translate(${dx/2}px,-50%)`;hint.classList.toggle('go',dx>=70)},{passive:true});
 document.addEventListener('touchend',e=>{if(sx===null)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=Math.abs(t.clientY-sy);sx=null;hint.style.opacity=0;hint.classList.remove('go');if(dx>70&&dy<70&&Date.now()-t0<900)goBack()},{passive:true});

/* ---------- UNOS ---------- */
function addMin(hm,m){if(!hm)return '';const[h,mm]=hm.split(':').map(Number);let t=((h*60+mm+Math.round(m))%1440+1440)%1440;return pad(Math.floor(t/60))+':'+pad(t%60)}
const tRange=e=>e.from?`${e.from}–${e.to||''}`:'';
const DUR=()=>(S.durations&&S.durations.length?S.durations:HOURS);
function durLabel(x){const m=Math.round(x*60);if(m<60)return{b:String(m),e:'min'};const h=Math.floor(m/60),mm=m%60;
 if(mm===0)return{b:String(h),e:h===1?'sat':h<5?'sata':'sati'};if(mm===30)return{b:num(r2(x)),e:'sati'};return{b:h+':'+pad(mm),e:'h'}}
function durText(x){const m=Math.round(x*60),h=Math.floor(m/60),mm=m%60;return h?(h+' h'+(mm?' '+mm+' min':'')):mm+' min'}
const selKids=()=>W.multi?(W.sel||[]):[W.childId];

 if(st<5)h+=`<div class="steps">${['Dijete','Vrsta','Sati','Potvrda'].map((s,i)=>`<div class="st ${i+1<st?'sdone':''} ${i+1===st?'on':''}">${s}</div>`).join('')}</div>`;
 const ks=selKids();
 const kidsLbl=()=>ks.length===1?esc(child(ks[0]).name):ks.length+' djece';
 const picked=()=>`<div class="picked"><button class="chip" data-act="step" data-s="1">${kidsLbl()} <small>promijeni</small></button>${st>2&&W.typeId?`<button class="chip" data-act="step" data-s="2">${esc(type(W.typeId).name)} <small>promijeni</small></button>`:''}</div>`;
 const backBtn=()=>`<button class="back" data-act="back">${I.left}Nazad</button>`;
 if(st===1){
  const n=(W.sel||[]).length;
  h+=workCard()+`<div class="kidbar"><h2>Izaberi dijete</h2><div class="kbtns">${W.multi?`<button class="kb go" data-act="mnext" id="mnext" ${n?'':'disabled'}>Dalje (${n})</button>`:''}<button class="kb ${W.multi?'on':''}" data-act="multi">${W.multi?'✓ ':''}Više djece</button></div></div>
  <input id="q" class="search" type="search" placeholder="Traži po imenu…" autocomplete="off">
  <div class="kids">${active(S.children).sort(byName).map(c=>`<button class="kid ${W.multi&&(W.sel||[]).includes(c.id)?'sel':''}" data-act="child" data-id="${c.id}" data-n="${esc(c.name.toLowerCase())}"><span class="av">${W.multi&&(W.sel||[]).includes(c.id)?'✓':esc(initials(c.name))}</span><span class="kn">${esc(c.name)}</span></button>`).join('')}</div>`;
  if(!active(S.children).length)h+=`<div class="empty">Još nema djece. ${isDir()?'Dodajte ih u Postavkama.':'Uprava ih dodaje u Postavkama.'}</div>`;
 }
 if(st===2){
  h+=backBtn()+picked()+`<h2>Vrsta treninga</h2><div class="types">${active(S.types).map(t=>`<button class="type" style="--c:${t.color}" data-act="type" data-id="${t.id}"><span class="tn">${esc(t.name)}</span>${SP()?`<span class="tp">${km(t.price)} / sat</span>`:''}</button>`).join('')}</div>`;
 }
 if(st===3){

  h+=backBtn()+picked()+`<h2>Koliko sati?</h2><div class="hours">${DUR().map(x=>{const L=durLabel(x);return `<button class="hr" data-act="hours" data-h="${x}"><b>${L.b}</b><em>${L.e}</em>${SP()?`<span>${km(x*t.price)}</span>`:''}</button>`}).join('')}</div>`;
 }
 if(st===4){
  const t=type(W.typeId),multi=ks.length>1,one=W.hours*t.price;
  h+=`<h2 class="h2c">Provjeri i potvrdi</h2><div class="card cfc">
   ${multi?`<div class="cf-row" style="align-items:flex-start"><span>Djeca (${ks.length})</span><b class="klist">${ks.map(id=>esc(child(id).name)).join('<br>')}</b></div>`:`<div class="cf-row"><span>Dijete</span><b>${esc(child(ks[0]).name)}</b></div>`}
   <div class="cf-row"><span>Vrsta</span><b>${esc(t.name)}</b></div>
   <div class="cf-row"><span>Trajanje</span><b>${durText(W.hours)}${SP()?` <small class="muted" style="font-weight:500">× ${km(t.price)}</small>`:''}</b></div>

   ${SP()?`<div class="cf-total"><span>${multi?`Iznos (${ks.length} × ${km(one)})`:'Iznos'}</span><b>${km(one*ks.length)}</b></div>`:''}</div>
   ${!isDir()&&!myOpen()?'<div class="wwarn" style="margin:8px 0 0">Niste započeli rad danas. Trening se svejedno može sačuvati.</div>':''}

 if(st===5){

    <button class="btn big ok" data-act="again">Još jedan trening za istu djecu</button>
    <button class="btn" data-act="restart">Druga djeca</button>
    <button class="btn ghost danger" data-act="undo">Poništi sve (${L.length})</button>`;
  }else{

   const day=visible().filter(x=>x.childId===e.childId&&x.date===e.date);
   h+=`<div class="done"><div class="tick">${I.check}</div><h2 style="margin-bottom:4px">Sačuvano</h2>
    <p class="sum">${esc(c.name)} · ${esc(e.typeName)} · ${hrs(e.hours)}${SP()?` · <b>${km(e.amount)}</b>`:''}</p>
    ${day.length?`<p class="muted">${e.date===today()?'Danas':fmtDate(e.date)} za ${esc(first)}${isDir()?'':' (vaši unosi)'}: ${day.length} ${day.length===1?'trening':'treninga'}, ${SP()?km(sum(day,x=>x.amount)):hrs(sum(day,x=>x.hours))}</p>`:''}</div>

  return `<div class="dayhead"><span>${fmtDay(d)}</span><span class="muted">${fmtMin(sum(l,liveMin))}</span></div><div class="rows">${l.map(r=>workRow(r,WD)).join('')}</div>`}).join('');
}

function workSection(){
 const ws=S.work.filter(r=>r.date.startsWith(month)&&(!trFilter||r.trainerId===trFilter));
 if(!ws.length&&!S.trainers.length)return '';
 const flags=ws.filter(r=>r.flag).length;
 const ids=[...new Set(S.trainers.filter(t=>!t.archived&&t.role!=='superadmin').map(t=>t.id).concat(ws.map(r=>r.trainerId)))].filter(id=>!trFilter||id===trFilter);
 let h=`<h3>Radno vrijeme</h3>${flags?`<div class="wwarn" style="margin-bottom:8px">${flags} ${flags===1?'zapis čeka':'zapisa čeka'} provjeru – otvorite trenera i potvrdite ili ispravite.</div>`:''}<div class="rows">`;
 h+=ids.map(id=>{const l=ws.filter(r=>r.trainerId===id),tr=S.entries.filter(e=>e.trainerId===id&&e.date.startsWith(month)),f=l.filter(r=>r.flag).length,live=l.some(r=>!r.end);
  return `<button class="row" data-act="radno" data-id="${id}"><div class="grow"><div class="t">${esc(trName(id))} ${live?'<span class="wb live">radi</span>':''} ${f?`<span class="wb warn">${f} za provjeru</span>`:''}</div><div class="s">${new Set(l.map(r=>r.date)).size} dana · rad ${fmtMin(sum(l,liveMin))} · treninzi ${num(sum(tr,e=>e.hours))} h</div></div>${I.chev}</button>`}).join('')||'<div class="row"><div class="grow s">Nema trenera.</div></div>';
 return h+`</div>`;
}
function downloadWorkCSV(){
 const ws=S.work.filter(r=>r.date.startsWith(month)).sort((a,b)=>trName(a.trainerId).localeCompare(trName(b.trainerId),'bs')||Date.parse(a.start)-Date.parse(b.start));
 const cell=v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 const rows=[['Trener','Datum','Početak','Kraj','Trajanje (h)','Status','Napomena']];
 ws.forEach(r=>rows.push([trName(r.trainerId),fmtDate(r.date),tHM(r.start),r.end?tHM(r.end):'u toku',(liveMin(r)/60).toFixed(2).replace('.',','),[r.auto?'zatvoreno u ponoć':'',r.flag?'čeka provjeru':'',r.fixedBy&&!r.flag?'provjereno':''].filter(Boolean).join(', '),r.note]));
 const csv='\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
 a.download=`TK-Bosna-radno-vrijeme-${month}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
 toast('Fajl preuzet');

let IMP=null;
function splitRows(text){
 text=String(text||'').replace(/\r\n?/g,'\n').replace(/^﻿/,'');
 const first=text.split('\n').find(l=>l.trim())||'';
 const del=first.includes('\t')?'\t':(first.split(';').length>first.split(',').length?';':',');
 const rows=[];let row=[],cur='',inq=false;
 for(let i=0;i<text.length;i++){const ch=text[i];
  if(inq){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else inq=false}else cur+=ch;continue}
  if(ch==='"'&&cur==='')inq=true;else if(ch===del){row.push(cur);cur=''}else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur=''}else cur+=ch}
 row.push(cur);rows.push(row);
 return rows.map(r=>r.map(c=>String(c).trim())).filter(r=>r.some(Boolean));
}
function analyzeRows(rows){
 if(rows.length&&/ime|prezime|roditelj/i.test(rows[0].join(' ')))rows=rows.slice(1);
 const have=new Set(S.children.map(c=>c.name.toLowerCase().replace(/\s+/g,' ')));const seen=new Set();
 return rows.map(r=>{
  const[ime='',prez='',rod='',email='',tel='']=r;const name=(ime+' '+prez).trim().replace(/\s+/g,' ');const k=name.toLowerCase();
  let st='ok',msg='';
  if(!name){st='err';msg='nema imena'}
  else if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){st='err';msg='neispravan email'}
  else if(have.has(k)){st='skip';msg='već postoji'}
  else if(seen.has(k)){st='skip';msg='dupli red'}
  seen.add(k);
  return{name,parent:rod,email,phone:tel,st,msg};
 });
}

 wcsv:()=>downloadWorkCSV(),
 wstart:(d,el)=>guard(el,async()=>{await q(sb.rpc('zapocni_rad',{}));await loadWork();render();toast('Rad je započet')},'…'),
 wstop:()=>{const o=myOpen();confirmYN('Završiti rad?',o?`Radite od ${tHM(o.start)} (${fmtMin(liveMin(o))}).`:'',()=>guard(null,async()=>{await q(sb.rpc('zavrsi_rad'));await loadWork();render();toast('Rad je završen')}))},
 wlate:()=>timeSheet('Kasni početak rada','Rad se započinje sada, a direktor vidi vaš prijedlog stvarnog početka i ispravlja ga.',
   `<label>Kada ste stvarno počeli?<input type="time" id="wl_t" max="${hmNow()}"></label><label>Napomena (nije obavezno)<textarea id="wl_n" rows="2" placeholder="npr. zaboravio sam prijaviti dolazak"></textarea></label>`,'wlatesave'),
 wlatesave:(d,el)=>{const t=$('#wl_t').value,n=$('#wl_n').value.trim();if(!t&&!n)return toast('Upišite vrijeme ili napomenu');
   if(t&&t>hmNow())return toast('Vrijeme ne može biti u budućnosti');
   guard(el,async()=>{await q(sb.rpc('zapocni_rad',{p_napomena:n||(t?'Stvarni početak '+t:null),p_predlozeni_pocetak:toIso(today(),t)}));closeSheet();await loadWork();render();toast('Rad je započet – prijedlog je poslan direktoru')},'…')},
 wprop:d=>{const r=S.work.concat(S.myRecent).find(x=>x.id===d.id);if(!r)return;
   timeSheet('Predloži ispravku',`${fmtDay(r.date)} · ${tHM(r.start)} – ${r.end?tHM(r.end):'…'}${r.auto?' (zatvoreno u ponoć)':''}`,
   `<div class="g2"><label>Stvarni početak<input type="time" id="wp_s" value=""></label><label>Stvarni kraj<input type="time" id="wp_e" value=""></label></div><label>Napomena<textarea id="wp_n" rows="2" placeholder="npr. otišao sam u 16:00"></textarea></label><p class="hint" style="margin:6px 0 0">Popunite samo ono što treba ispraviti.</p>`,'wpropsave',r.id)},
 wpropsave:(d,el)=>{const r=S.work.concat(S.myRecent).find(x=>x.id===d.id);const s=$('#wp_s').value,e=$('#wp_e').value,n=$('#wp_n').value.trim();
   if(!s&&!e&&!n)return toast('Upišite ispravku ili napomenu');
   guard(el,async()=>{await q(sb.rpc('predlozi_ispravku',{p_id:r.id,p_pocetak:toIso(r.date,s),p_kraj:toIso(r.date,e),p_napomena:n||null}));closeSheet();await loadWork();render();toast('Prijedlog je poslan direktoru')},'…')},
 wacc:(d,el)=>{const r=S.work.find(x=>x.id===d.id);confirmYN('Prihvatiti prijedlog?',`${tHM(r.pStart||r.start)} – ${r.pEnd||r.end?tHM(r.pEnd||r.end):'…'}`,()=>guard(null,async()=>{await q(sb.rpc('ispravi_rad',{p_id:r.id,p_pocetak:r.pStart||r.start,p_kraj:r.pEnd||r.end}));await loadWork();render();toast('Ispravljeno')}))},
 wok:(d,el)=>{const r=S.work.find(x=>x.id===d.id);guard(el,async()=>{await q(sb.rpc('ispravi_rad',{p_id:r.id,p_pocetak:r.start,p_kraj:r.end}));await loadWork();render();toast('Označeno kao provjereno')},'…')},
 wedit:d=>{const r=S.work.find(x=>x.id===d.id);
   timeSheet('Uredi radno vrijeme',`${esc(trName(r.trainerId))} · ${fmtDay(r.date)}`,`<label>Datum<input type="date" id="we_d" value="${r.date}" max="${today()}"></label><div class="g2"><label>Početak<input type="time" id="we_s" value="${tHM(r.start)}"></label><label>Kraj<input type="time" id="we_e" value="${r.end?tHM(r.end):''}"></label></div>${r.end?'':'<p class="hint" style="margin:6px 0 0">Prazan kraj znači da trener još radi.</p>'}`,'weditsave',r.id)},
 weditsave:(d,el)=>{const dt=$('#we_d').value,s=$('#we_s').value,e=$('#we_e').value;if(!dt||!s)return toast('Upišite datum i početak');
   let ps=toIso(dt,s),pe=e?toIso(dt,e):null;if(pe&&pe<=ps){const x=new Date(pe);x.setDate(x.getDate()+1);pe=x.toISOString()}
   guard(el,async()=>{await q(sb.rpc('ispravi_rad',{p_id:d.id,p_pocetak:ps,p_kraj:pe}));closeSheet();await loadWork();render();toast('Sačuvano')},'…')},
 wdel:d=>{const r=S.work.find(x=>x.id===d.id);confirmYN('Obrisati ovu smjenu?',`${fmtDay(r.date)} · ${tHM(r.start)} – ${r.end?tHM(r.end):'…'}`,()=>guard(null,async()=>{await q(sb.rpc('obrisi_rad',{p_id:r.id}));await loadWork();render();toast('Obrisano')}),true)},
 wadd:()=>timeSheet('Dodaj smjenu',esc(trName(radnoTr)),`<label>Datum<input type="date" id="wa_d" value="${today()}" max="${today()}"></label><div class="g2"><label>Početak<input type="time" id="wa_s"></label><label>Kraj<input type="time" id="wa_e"></label></div><label>Napomena<textarea id="wa_n" rows="2"></textarea></label>`,'waddsave'),
 waddsave:(d,el)=>{const dt=$('#wa_d').value,s=$('#wa_s').value,e=$('#wa_e').value;if(!dt||!s||!e)return toast('Upišite datum, početak i kraj');
   let ps=toIso(dt,s),pe=toIso(dt,e);if(pe<=ps){const x=new Date(pe);x.setDate(x.getDate()+1);pe=x.toISOString()}
   guard(el,async()=>{await q(sb.rpc('dodaj_rad',{p_trener:radnoTr,p_pocetak:ps,p_kraj:pe,p_napomena:$('#wa_n').value.trim()||null}));closeSheet();await loadWork();render();toast('Smjena dodana')},'…')},
 pause:()=>confirmYN(S.paused?'Da li stvarno želite aktivirati aplikaciju?':'Da li stvarno želite pauzirati aplikaciju?',S.paused?'Treneri i direktor ponovo dobijaju pristup.':'Treneri i direktor odmah gube pristup. Podaci ostaju sačuvani.',()=>guard(null,async()=>{
   const r=await q(sb.rpc('postavi_pauzu',{p_pauzirano:!S.paused}));S.paused=!!r.pauzirano;await admLoad();render();toast(S.paused?'Aplikacija je pauzirana':'Aplikacija je aktivna')}),!S.paused),
 obim:d=>{ADM.obim=d.o;render()},
 bkp:(d,el)=>guard(el,async()=>{const r=await q(sb.rpc('napravi_backup'));downloadJSON(r.podaci,bkpName(r.kreirano));await admLoad();render();toast('Backup napravljen i preuzet')},'Pravim backup…'),
 bdl:(d,el)=>guard(el,async()=>{const p=await q(sb.rpc('backup_podaci',{p_id:d.id}));const b=ADM.backups.find(x=>x.id===d.id);downloadJSON(p,bkpName(b.kreirano))},'…'),
 bdel:d=>{const b=ADM.backups.find(x=>x.id===d.id);confirmYN('Obrisati ovaj backup?',fmtTs(b.kreirano)+' · '+b.broj_treninga+' treninga',()=>guard(null,async()=>{await q(sb.rpc('obrisi_backup',{p_id:d.id}));await admLoad();render();toast('Backup obrisan')}),true)},
 brs:d=>{const b=ADM.backups.find(x=>x.id===d.id);confirmYN('Vratiti podatke iz ovog backupa?',`${fmtTs(b.kreirano)} · ${b.broj_treninga} treninga, ${b.broj_djece} djece. Postojeći podaci se dopunjavaju i ispravljaju.`,()=>guard(null,async()=>{
   const p=await q(sb.rpc('backup_podaci',{p_id:d.id}));const r=await q(sb.rpc('vrati_backup',{p_podaci:p}));await afterDataChange();toast(`Vraćeno: ${r.treninga} treninga, ${r.djece} djece`)}))},
 reset:()=>{const v=($('#nconf')||{}).value||'';if(v.trim()!=='NULIRAJ')return toast('Upišite NULIRAJ velikim slovima');
   confirmYN(ADM.obim==='treninzi'?'Da li stvarno želite obrisati sve treninge i radno vrijeme?':'Da li stvarno želite obrisati SVE podatke?','Ovo se može vratiti samo iz backupa.',()=>guard(null,async()=>{
   const r=await q(sb.rpc('nuliraj',{p_obim:ADM.obim,p_potvrda:'NULIRAJ'}));await afterDataChange();toast(`Nulirano: obrisano ${r.obrisano_treninga} treninga`)}),true)},
 uact:d=>{const u=S.trainers.find(x=>x.id===d.id);if(!u)return;const on=u.archived;
   confirmYN(on?`Odobriti pristup za ${esc(u.name)}?`:`Blokirati pristup za ${esc(u.name)}?`,'',()=>guard(null,async()=>{await q(sb.from('profili').update({aktivan:on}).eq('id',u.id).select('id').single());u.archived=!on;render();toast(on?'Pristup odobren':'Pristup blokiran')}),!on)},
 imp:()=>{IMP=null;impSheet()},
 imptpl:()=>{const csv='\ufeff'+['Ime;Prezime;Ime roditelja;Email;Telefon','Amar;Hodžić;Selma Hodžić;selma@primjer.ba;061 123 456'].join('\r\n');
   const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='predlozak-djeca.csv';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1000)},
 impparse:()=>{const t=$('#imptxt').value;if(!t.trim())return toast('Zalijepite redove ili izaberite fajl');IMP={rows:analyzeRows(splitRows(t))};impSheet()},
 impgo:(d,el)=>guard(el,async()=>{const ok=IMP.rows.filter(r=>r.st==='ok');
   const ins=await q(sb.from('djeca').insert(ok.map(r=>({ime:r.name,roditelj:r.parent||null,email_roditelja:r.email||null,telefon_roditelja:r.phone||null,kanali:r.email?['email']:[]}))).select('*'));
   ins.forEach(r=>S.children.push(mapC(r)));IMP=null;closeSheet();render();toast(`Uvezeno ${ins.length} djece`)},'Uvozim…'),
 send:d=>sendTo(d.k),
 chtog:(d,el)=>{const c=S.children.find(x=>x.id===d.id);if(!c)return;const on=!c.ch.includes(d.k);
   const next=on?[...c.ch,d.k]:c.ch.filter(k=>k!==d.k);const prev=c.ch;c.ch=['email','viber','whatsapp'].filter(k=>next.includes(k));
   el.classList.toggle('on',on);el.setAttribute('aria-pressed',on);
   q(sb.from('djeca').update({kanali:c.ch}).eq('id',c.id).select('id').single()).catch(e=>{c.ch=prev;el.classList.toggle('on',!on);toast(errText(e))})},
 preview:()=>{const kid=S.children.find(c=>S.entries.some(e=>e.childId===c.id&&e.date.startsWith(month)))||S.children[0];
   if(!kid)return toast('Dodajte bar jedno dijete');const old=reportChild;reportChild=kid.id;const subj=reportSubject(),txt=reportText();reportChild=old;
   openSheet(`<p class="sh-title">Primjer poruke</p><p class="muted" style="margin-top:0">Za: ${esc(kid.name)} · ${monthLabel(month)}</p><div class="pv"><b>${esc(subj)}</b>\n\n${esc(txt)}</div><button class="btn" data-act="close">Zatvori</button>`)},
 radd:()=>openSheet(`<p class="sh-title">Novi trener</p><div class="ef">
  <label>Ime i prezime<input id="nt_ime" autocomplete="off"></label>
  <label>Email (za prijavu)<input id="nt_email" type="email" inputmode="email" autocapitalize="off" autocomplete="off"></label>
  <label>Početna lozinka<input id="nt_pass" value="${genPass()}" autocomplete="off" autocapitalize="off"></label></div>
  <p class="hint" style="margin:8px 0 0">Lozinku trener kasnije može dobiti novu od vas (dugme „Lozinka“).</p>
  <button class="btn big ok" data-act="raddsave">Dodaj trenera</button><button class="btn ghost" data-act="close">Odustani</button>`),
 raddsave:(d,el)=>guard(el,async()=>{
   const ime=$('#nt_ime').value.trim(),email=$('#nt_email').value.trim(),lozinka=$('#nt_pass').value;
   if(!ime||!email)return toast('Upišite ime i email');
   await callFn({akcija:'dodaj',ime,email,lozinka});
   await loadBase();render();credSheet(ime,email,lozinka,'Trener je dodan');
 },'Dodajem…'),
 rpass:d=>{const t=S.trainers.find(x=>x.id===d.id);if(!t)return;openSheet(`<p class="sh-title">Nova lozinka</p><p class="muted" style="margin-top:0">${esc(t.name)}${t.email?' · '+esc(t.email):''}</p>
  <div class="ef"><label>Nova lozinka<input id="np_pass" value="${genPass()}" autocomplete="off" autocapitalize="off"></label></div>
  <button class="btn big ok" data-act="rpasssave" data-id="${t.id}">Postavi lozinku</button><button class="btn ghost" data-act="close">Odustani</button>`)},
 rpasssave:(d,el)=>guard(el,async()=>{const t=S.trainers.find(x=>x.id===d.id);const lozinka=$('#np_pass').value;
   await callFn({akcija:'lozinka',id:d.id,lozinka});credSheet(t.name,t.email,lozinka,'Lozinka je promijenjena')},'Spremam…'),
 credcopy:async()=>{try{await navigator.clipboard.writeText($('#credtxt').textContent);toast('Kopirano')}catch(e){toast('Označite tekst i kopirajte ga')}},
 rm:d=>{const it=LIST[d.k]().find(x=>x.id===d.id);if(!it)return;
   const what={types:'vrstu treninga',children:'dijete',trainers:'trenera'}[d.k];
   const txt=d.k==='trainers'?`<b>${esc(it.name)}</b> se više neće moći prijaviti u aplikaciju. Njegovi stari unosi i izvještaji ostaju. Možete ga vratiti iz dijela „Uklonjeno“.`
     :`<b>${esc(it.name)}</b> se uklanja iz izbora za nove unose. Stari unosi i izvještaji ostaju netaknuti. Možete vratiti iz dijela „Uklonjeno“.`;
   ask(`Ukloniti ${what}?`,txt,'Ukloni',()=>guard(null,async()=>{await q(sb.from(TBL[d.k][0]).update({[TBL[d.k][1]]:false}).eq('id',d.id).select('id').single());it.archived=true;render();toast('Uklonjeno')}))},
 restore:(d,el)=>guard(el,async()=>{const it=LIST[d.k]().find(x=>x.id===d.id);await q(sb.from(TBL[d.k][0]).update({[TBL[d.k][1]]:true}).eq('id',d.id).select('id').single());it.archived=false;render();toast('Vraćeno')})
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f)f(el.dataset,el,e)});

async function upd(table,id,obj,okMsg){try{await q(sb.from(table).update(obj).eq('id',id).select('id').single());if(okMsg)toast(okMsg)}catch(e){toast(errText(e));await refresh(true)}}
const C={
 month:async t=>{if(!t.value)return;month=t.value;render();try{await loadMonth(true);render()}catch(e){toast(errText(e))}},
 tr:t=>{trFilter=t.value;render()},
 dt:t=>{if(t.value)W.date=t.value},
 tf:t=>{W.tFrom=t.value;W.tTo=t.value?addMin(t.value,W.hours*60):'';const o=$('#tt');if(o)o.value=W.tTo},
 tt:t=>{W.tTo=t.value;W.tFrom=t.value?addMin(t.value,-W.hours*60):'';const o=$('#tf');if(o)o.value=W.tFrom},
 tname:t=>{const x=type(t.dataset.id);const v=t.value.trim();if(x&&v){x.name=v;upd('vrste_treninga',x.id,{naziv:v},'Sačuvano')}else if(x)t.value=x.name},
 tprice:t=>{const x=type(t.dataset.id);const p=parseFloat(t.value.replace(',','.'));if(x&&p>=0){x.price=r2(p);t.value=num(x.price);upd('vrste_treninga',x.id,{cijena_po_satu:x.price},'Cijena sačuvana')}else if(x)t.value=num(x.price)},
 cname:t=>{const c=S.children.find(c=>c.id===t.dataset.id);const v=t.value.trim();if(c&&v){c.name=v;upd('djeca',c.id,{ime:v},'Sačuvano')}else if(c)t.value=c.name},
 cparent:t=>{const c=S.children.find(c=>c.id===t.dataset.id);if(c){c.parent=t.value.trim();upd('djeca',c.id,{roditelj:c.parent||null},'Sačuvano')}},
 cemail:t=>{const c=S.children.find(c=>c.id===t.dataset.id);if(c){c.email=t.value.trim();upd('djeca',c.id,{email_roditelja:c.email||null},'Sačuvano')}},
 role:async t=>{const u=S.trainers.find(x=>x.id===t.dataset.id);const v=t.value,old=u.role;try{await q(sb.from('profili').update({uloga:v}).eq('id',u.id).select('id').single());u.role=v;toast('Uloga promijenjena')}catch(e){t.value=old;toast(errText(e))}},
 rfile:async t=>{const f=t.files&&t.files[0];if(!f)return;let p;try{p=JSON.parse(await f.text())}catch(e){return toast('Fajl nije ispravan backup')}
   if(!p||!p.treninzi||!p.djeca)return toast('Fajl nije ispravan backup');
   confirmYN('Vratiti podatke iz fajla?',`${esc(f.name)} · ${p.treninzi.length} treninga, ${p.djeca.length} djece`,()=>guard(null,async()=>{const r=await q(sb.rpc('vrati_backup',{p_podaci:p}));await afterDataChange();toast(`Vraćeno: ${r.treninga} treninga, ${r.djece} djece`)}));t.value=''},
 impfile:async t=>{const f=t.files&&t.files[0];if(!f)return;
   try{let rows;if(/\.xlsx?$/i.test(f.name)){const X=await loadXLSX();const wb=X.read(await f.arrayBuffer(),{type:'array'});rows=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''}).map(r=>r.map(c=>String(c).trim())).filter(r=>r.some(Boolean))}
   else rows=splitRows(await f.text());IMP={rows:analyzeRows(rows)};impSheet()}catch(e){toast(errText(e))}},
 cphone:t=>{const c=S.children.find(c=>c.id===t.dataset.id);if(c){c.phone=t.value.trim();upd('djeca',c.id,{telefon_roditelja:c.phone||null},'Sačuvano')}},
 msg:t=>{const f=t.dataset.f,v=t.value;S.msg[f]=v;const col={naslov:'poruka_naslov',uvod:'poruka_uvod',zavrsetak:'poruka_zavrsetak'}[f];upd('postavke',1,{[col]:v},'Poruka sačuvana')},
 rname:t=>{const r=S.trainers.find(r=>r.id===t.dataset.id);const v=t.value.trim();if(r&&v){r.name=v;if(r.id===me.id){me.name=v;$('#who').textContent=v}upd('profili',r.id,{ime:v},'Sačuvano')}else if(r)t.value=r.name},
 prices:async t=>{const v=t.checked;try{await q(sb.from('postavke').update({treneri_vide_cijene:v}).eq('id',1).select('id').single());S.trenerVidiCijene=v;render();toast(v?'Treneri sada vide cijene':'Cijene su sakrivene od trenera')}catch(e){t.checked=!v;toast(errText(e))}},
 e_child:t=>{E.childId=t.value},
 e_type:t=>{const x=type(t.value);if(x){E.typeId=x.id;E.typeName=x.name;E.price=x.price;editSheet()}},
 e_price:t=>{const p=parseFloat(t.value.replace(',','.'));if(p>=0)E.price=r2(p);editSheet()},
 e_date:t=>{if(t.value)E.date=t.value},
 e_tr:t=>{E.trainerId=t.value},
 e_tf:t=>{E.from=t.value;E.to=t.value?addMin(t.value,E.hours*60):'';const o=$('#e_tt');if(o)o.value=E.to},
 e_tt:t=>{E.to=t.value;E.from=t.value?addMin(t.value,-E.hours*60):'';const o=$('#e_tf');if(o)o.value=E.from}
};
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.change;if(k&&C[k])C[k](e.target)});
document.addEventListener('input',e=>{if(e.target.id==='cq'){const v=e.target.value.trim().toLowerCase();document.querySelectorAll('.citem').forEach(b=>b.style.display=b.dataset.n.includes(v)?'':'none');return}if(e.target.id==='q'){const v=e.target.value.trim().toLowerCase();document.querySelectorAll('.kid').forEach(b=>b.style.display=b.dataset.n.includes(v)?'':'none')}});

/* ---------- bez zumiranja (iOS Safari ignoriše user-scalable, pa ga blokiramo i ovdje) ---------- */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
let lastTap=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTap<300&&!e.target.closest('input,textarea,select'))e.preventDefault();lastTap=n},{passive:false});

setInterval(()=>{const el=$('#wtimer'),o=me&&myOpen();if(el&&o)el.textContent=fmtMin(liveMin(o))},30000);

/* ---------- start ---------- */
if(!sb){$('#main').innerHTML='<div class="empty">Aplikacija se ne može učitati. Provjerite internet vezu i osvježite stranicu.</div>'}
else{sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&me)showLogin()});boot()}

</script>
</body>
</html>
